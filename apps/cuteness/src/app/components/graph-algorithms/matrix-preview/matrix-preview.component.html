<button
  class="matrix-button"
  z-button
  zType="ghost"
  zSize="icon"
  aria-label="Preview or download adjacency matrix"
  (focus)="preview.set(true)"
  (click)="activate()"
>
  <ng-icon name="lucideGrid2X2" />
</button>
@if (preview()) {
  <section class="preview" aria-label="Adjacency matrix preview">
    <header>
      <span>Adjacency matrix</span>
      <button z-button zType="ghost" zSize="icon" aria-label="Close matrix preview" (click)="preview.set(false)">
        <ng-icon name="lucideX" />
      </button>
    </header>
    <div class="matrix-container">
      <cuteness-matrix [adjacencyMatrix]="adjacencyMatrix()" [solution]="solution()" />
    </div>
    <button z-button zType="ghost" (click)="download()">Download text</button>
  </section>
}
