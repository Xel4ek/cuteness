<button mat-icon-button (click)="copyTableToClipboard()" class="copy-button">
  <mat-icon>file_copy</mat-icon>
</button>
<div class="table-content">
  <table>
    @for (row of adjacencyMatrix; track $index; let i = $index) {
      <tr>
        @for (cell of row; track $index; let j = $index) {
          <td class="cell" [class.used]="inSolution(i, j)">
            <span [matTooltip]="(cell | number) ?? ''" [class.infinity]="cell === 0">
              {{ cell | number | replaceZeroWithInfinity }}
            </span>
          </td>
        }
      </tr>
    }
  </table>
</div>
