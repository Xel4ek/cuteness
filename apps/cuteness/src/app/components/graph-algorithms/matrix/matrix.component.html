<button
  z-button
  zType="ghost"
  zSize="icon"
  aria-label="Copy adjacency matrix"
  zTooltip="Copy matrix"
  (click)="copyTableToClipboard()"
  class="copy-button"
>
  <ng-icon name="lucideCopy" />
</button>
<div class="table-content">
  <table>
    @for (row of adjacencyMatrix; track $index; let i = $index) {
      <tr>
        @for (cell of row; track $index; let j = $index) {
          <td class="cell" [class.used]="inSolution(i, j)">
            <span [zTooltip]="(cell | number) ?? ''" [class.infinity]="cell === 0">
              {{ cell | number | replaceZeroWithInfinity }}
            </span>
          </td>
        }
      </tr>
    }
  </table>
</div>
