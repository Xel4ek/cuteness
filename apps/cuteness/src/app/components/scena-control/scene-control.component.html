@for (action of actionList; track $index) {
  <div class="control">
    <span>{{ action.title }}</span>
    @if (!action.values) {
      <z-slider
        [zAriaLabel]="action.title"
        [zMin]="action.min"
        [zMax]="action.max"
        [zValue]="action.value"
        (zValueChange)="action.action($event)"
      />
    } @else {
      <select
        z-select
        [attr.aria-label]="action.title"
        [ngModel]="action.value"
        (ngModelChange)="action.action($event)"
      >
        @for (option of action.values; track option) {
          <option [ngValue]="option">{{ option }}</option>
        }
      </select>
    }
  </div>
}
