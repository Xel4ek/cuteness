<span class="iteration-label" aria-hidden="true">Iterations</span>
<div class="stepper">
  <button
    type="button"
    z-button
    zType="ghost"
    zSize="icon"
    aria-label="Decrease iterations"
    [disabled]="disabled() || candidate() <= 100"
    (pointerdown)="$event.preventDefault()"
    (click)="commit(-100)"
  >
    −
  </button>
  <input
    #input
    aria-label="Maximum iterations"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    spellcheck="false"
    [value]="draft()"
    [disabled]="disabled()"
    (input)="edit($event)"
    (blur)="commit(); touch.emit()"
    (keydown.enter)="$event.preventDefault(); commit()"
  />
  <button
    type="button"
    z-button
    zType="ghost"
    zSize="icon"
    aria-label="Increase iterations"
    [disabled]="disabled() || candidate() >= 50000"
    (pointerdown)="$event.preventDefault()"
    (click)="commit(100)"
  >
    +
  </button>
</div>
