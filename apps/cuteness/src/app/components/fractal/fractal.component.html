<cuteness-scene-control [actionList]="actionList" />
<canvas
  style="position: absolute; left: 0; top: 0"
  #control
  cutenessSelectArea
  (setDefault)="reset()"
  (selectCoordinates)="selectCoordinates($event)"
  (transformCoordinates)="transformCoordinates($event)"
  cutenessFullScreen
></canvas>
<canvas cutenessFullScreen #offscreenCanvas></canvas>
<p class="navigation-hint">
  <span class="mouse-hint">Scroll to zoom · Drag to pan · Shift + drag to select · Double-click to reset</span>
  <span class="touch-hint">Pinch to zoom · Drag to pan · Double-tap to reset</span>
</p>
