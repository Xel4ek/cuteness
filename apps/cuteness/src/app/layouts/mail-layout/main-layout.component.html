<header class="toolbar">
  <button
    type="button"
    z-button
    zType="ghost"
    zSize="icon"
    class="hover:bg-primary hover:text-primary-foreground"
    aria-label="Open navigation"
    aria-haspopup="dialog"
    [attr.aria-expanded]="navigationOpen()"
    (click)="navigationOpen.set(true)"
  >
    <ng-icon name="lucideMenu" />
  </button>
  <a z-button zType="ghost" class="page-title hover:bg-primary hover:text-primary-foreground" routerLink="/">{{
    pageTitle()
  }}</a>
  <span class="info-block">
    @for (item of info$ | async | keyvalue: null; track item.key) {
      <span class="info"
        ><span>{{ item.key | titlecase }}</span> {{ item.value }}</span
      >
    }
  </span>
</header>

<z-sheet [(zVisible)]="navigationOpen" zLabel="Main navigation">
  <h2 class="m-0 px-4 py-4 pr-14 text-base font-semibold">Cuteness</h2>
  <nav class="navigation" aria-label="Main navigation">
    @for (module of modules; track module) {
      <a
        z-button
        zType="ghost"
        [routerLink]="['/', getRoute(module)]"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="navigationOpen.set(false)"
        >{{ module }}</a
      >
    }
  </nav>
</z-sheet>

<main class="page-content">
  <router-outlet></router-outlet>
</main>
