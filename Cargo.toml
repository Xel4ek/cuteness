[workspace]
members = ["vendors/fractal", "vendors/graph-algorithms", "vendors/solar-system"]
resolver = "3"

[workspace.dependencies]
cfg-if = "1.0.5"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
js-sys = "0.3.106"
log = "0.4.34"
ndarray = "0.17.2"
num-complex = "0.4.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
wee_alloc = "0.4.5"
wgpu = { version = "30.0.1", features = ["webgl"] }

[profile.dev.package.graph-algorithms-wasm]
opt-level = 3
codegen-units = 1

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.release.package.solar-system]
opt-level = "s"
